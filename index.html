<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>フィールドノート</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="フィールドノート">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Dancing+Script:wght@700&family=Noto+Sans+JP:wght@900&display=swap">
<style>
:root{--bg:#efe8d4;--paper:#fbf7ea;--ink:#2b3526;--sub:#6a7360;--line:#ddd3b8;--acc:#4f8446;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171c15;--paper:#20271d;--ink:#ecead8;--sub:#a1aa94;--line:#363f30;--acc:#8cc47c}}
:root[data-theme="dark"]{--bg:#171c15;--paper:#20271d;--ink:#ecead8;--sub:#a1aa94;--line:#363f30;--acc:#8cc47c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
button{font:inherit;color:inherit;cursor:pointer}
.book{height:100%;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.book::-webkit-scrollbar{display:none}
.pg{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;box-sizing:border-box;padding:22px 20px 72px;position:relative;background:var(--paper);box-shadow:inset -10px 0 14px -12px rgba(0,0,0,.35),inset 6px 0 0 -3px var(--line)}
.pg h2{margin:0 0 4px;font-size:26px;letter-spacing:.08em;font-weight:700}
.lead{margin:0 0 18px;color:var(--sub);font-size:14px;line-height:1.7}
/* cover */
.cover{--cov:#2f5a3c;--covd:#1d3b27;--gold:#e2c36e;padding:0;display:flex;flex-direction:column;color:var(--gold);background:repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 2px,transparent 2px 4px),repeating-linear-gradient(-45deg,rgba(0,0,0,.06) 0 2px,transparent 2px 4px),var(--cov);overflow:hidden}
.spine{position:absolute;left:0;top:0;bottom:0;width:26px;background:linear-gradient(90deg,var(--covd),var(--cov));border-right:2px solid var(--covd);box-shadow:inset -4px 0 6px rgba(0,0,0,.35)}
.spine::before{content:"";position:absolute;left:6px;right:6px;top:70px;bottom:70px;border-left:1px solid var(--gold);border-right:1px solid var(--gold);opacity:.7}
.corner{position:absolute;width:46px;height:46px;background:var(--covd);box-shadow:0 0 6px rgba(0,0,0,.3)}
.tl{top:0;left:26px;clip-path:polygon(0 0,100% 0,0 100%)}.tr{top:0;right:0;clip-path:polygon(0 0,100% 0,100% 100%)}
.bl{bottom:0;left:26px;clip-path:polygon(0 0,0 100%,100% 100%)}.br{bottom:0;right:0;clip-path:polygon(100% 0,100% 100%,0 100%)}
.ribbon{position:absolute;top:0;left:68%;width:14px;height:72px;background:#9c2f3a;clip-path:polygon(0 0,100% 0,100% 100%,50% 86%,0 100%)}
.frame{flex:1;margin:40px 26px 0 46px;border:2px solid var(--gold);padding:6px;position:relative;z-index:1}
.frame2{height:100%;box-sizing:border-box;border:1px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;background:rgba(0,0,0,.12)}
.cover h1{margin:0;font-size:36px;line-height:1.35;letter-spacing:.2em;color:var(--gold);text-shadow:0 1px 0 rgba(0,0,0,.5);font-weight:700}
.orn{width:60%;height:10px;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);position:relative}
.orn::after{content:"❖";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12px;padding:0 6px;background:var(--cov)}
.cover .sm{font-size:14px;letter-spacing:.3em}
.under{position:relative;z-index:1;padding:14px 22px 64px 46px}
.cl{font-size:12px;letter-spacing:.2em;text-align:center;opacity:.85}
.sw-row{display:flex;gap:10px;justify-content:center;margin:8px 0 14px;overflow-x:auto;padding:4px 2px;scrollbar-width:none}
.sw{flex:0 0 auto;border:0;background:none;padding:0;text-align:center;color:var(--gold);font-size:11px}
.sw i{display:block;width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.4);margin:0 auto 3px}
.sw.on i{border-color:var(--gold);box-shadow:0 0 0 3px rgba(226,195,110,.35)}
.open{width:100%;border:1.5px solid var(--gold);background:transparent;border-radius:6px;padding:12px;font-size:17px;letter-spacing:.2em;color:var(--gold)}
.cover:not([data-d="0"]) .fd{display:none}.cover[data-d="0"] .stage{display:none}
.stage{flex:1;position:relative;margin:34px 26px 0 26px;z-index:1}
.dg-row{display:flex;gap:6px;justify-content:center;margin:6px 0 10px;flex-wrap:wrap}
.dg{border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:999px;padding:6px 12px;font-size:13px}
.dg.on{background:var(--gold);color:var(--cov)}
.face{position:absolute;inset:0;display:none}
.cover[data-d="1"] .fy,.cover[data-d="2"] .fh{display:block}
.y-st{position:absolute;inset:8px;border:1.5px dashed var(--gold);border-radius:8px;opacity:.8}
.y-sp{position:absolute;left:-26px;top:-34px;bottom:0;width:24px;background:var(--covd);box-shadow:inset -5px 0 7px rgba(0,0,0,.4),2px 0 6px rgba(0,0,0,.35)}
.y-band{position:absolute;right:10%;top:-34px;bottom:0;width:13px;background:#1b1b1b;box-shadow:inset 2px 0 0 rgba(255,255,255,.14),inset -2px 0 0 rgba(0,0,0,.5),3px 0 7px rgba(0,0,0,.45)}
.y-lab{position:absolute;left:12%;right:24%;top:12%;background:#f6f1e0;border:1.5px solid var(--covd);padding:14px 10px;text-align:center;color:#2b3526}
.y-lab b{display:block;font-size:22px;letter-spacing:.1em}
.y-lab small{display:block;font-size:13px;color:#5a6a4a;margin:6px 0 14px}
.y-nm{display:flex;gap:6px;align-items:flex-end;font-size:14px;text-align:left}
.y-nm i{flex:1;border-bottom:1px solid #2b2b2b;height:14px}
.y-sp::before{content:"";position:absolute;left:10px;width:2px;top:12px;bottom:12px;background:repeating-linear-gradient(to bottom,var(--gold) 0 7px,transparent 7px 12px);opacity:.8}
.y-em{position:absolute;inset:22px;border:1px solid rgba(255,255,255,.28);box-shadow:0 0 0 1px rgba(0,0,0,.4),inset 0 0 0 1px rgba(0,0,0,.3);border-radius:3px}
.y-c{position:absolute;width:58px;height:58px;background:var(--covd);top:-34px}
.y-c.a{left:-2px;clip-path:polygon(0 0,100% 0,0 100%)}.y-c.b{right:-26px;clip-path:polygon(0 0,100% 0,100% 100%)}
.cover[data-d="1"]{box-shadow:inset 0 0 70px rgba(0,0,0,.45)}
.h-pl::after{content:"";position:absolute;inset:10px;border:1px solid rgba(90,74,42,.55);pointer-events:none}
.h-fr{position:absolute;inset:0;border:2px solid var(--gold);padding:6px;box-sizing:border-box}
.h-pl{height:100%;box-sizing:border-box;border:1px solid var(--gold);background:#efe3c4;position:relative;overflow:hidden;box-shadow:inset 0 0 30px rgba(120,80,30,.4)}
.h-pl::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 18% 22%,rgba(150,100,40,.18) 0 6px,transparent 7px),radial-gradient(circle at 80% 40%,rgba(150,100,40,.14) 0 4px,transparent 5px),radial-gradient(circle at 30% 80%,rgba(150,100,40,.12) 0 5px,transparent 6px)}
.h-plant{position:absolute;left:50%;top:3%;height:58%;transform:translateX(-50%);overflow:visible}
.h-lab{position:absolute;right:8px;bottom:8px;width:60%;background:#faf4e1;border:3px double #5a4a2a;padding:8px 10px;color:#2b2418;box-sizing:border-box}
.h-lab small{display:block;font-size:12px;color:#6a5a3a}
.h-lab b{display:block;font-size:19px;letter-spacing:.08em;margin:2px 0 6px}
.h-lab i{display:block;border-bottom:1px solid #5a4a2a;height:13px}
.h-c{position:absolute;width:30px;height:30px;background:var(--gold);opacity:.9}
.h-c.a{top:0;left:0;clip-path:polygon(0 0,100% 0,0 100%)}.h-c.b{top:0;right:0;clip-path:polygon(0 0,100% 0,100% 100%)}
.h-c.c{bottom:0;left:0;clip-path:polygon(0 0,0 100%,100% 100%)}.h-c.d{bottom:0;right:0;clip-path:polygon(100% 0,100% 100%,0 100%)}
.h-rb{position:absolute;top:-34px;left:72%;width:14px;height:72px;background:#9c2f3a;clip-path:polygon(0 0,100% 0,100% 100%,50% 86%,0 100%)}
.band{position:relative;height:110px;margin:-22px -20px 12px;overflow:hidden;cursor:pointer}
.band svg{width:100%;height:100%;display:block}
.band span{position:absolute;right:10px;bottom:6px;font-size:11px;color:#fff;background:rgba(0,0,0,.4);padding:2px 9px;border-radius:999px}
.sn-tabs{display:flex;gap:6px;margin:0 0 12px;position:sticky;top:0;background:var(--paper);padding:6px 0;z-index:3}
.sn-tabs button{flex:1;border:1px solid var(--line);background:none;border-radius:999px;padding:8px 0;font-size:14px}
.sn-tabs .on{background:var(--acc);color:#fff;border-color:var(--acc)}
.sn-card{display:flex;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.sn-e{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.sn-card b{font-size:17px}.sn-card small{display:block;color:var(--sub);font-size:13px}
.sn-now{font-style:normal;background:#d99a2b;color:#fff;font-size:11px;padding:1px 7px;border-radius:999px;margin-left:6px}
.sn-det{padding:6px 6px 14px 58px;font-size:14px;line-height:1.7;border-bottom:1px solid var(--line)}
.sn-warn{margin-top:8px;padding:8px 10px;border-radius:8px;background:rgba(190,60,40,.12);font-size:13px}
.sn-dg{margin:12px 0;padding:12px;border:1px solid var(--line);border-left:4px solid #c0392b;font-size:14px;line-height:1.7}
.sn-dg p{margin:6px 0 0}.sn-lv{font-style:normal;font-size:11px;padding:1px 8px;border-radius:999px;background:#d99a2b;color:#fff;margin-left:8px}.sn-lv.hi{background:#c0392b}
.sn-cal{display:grid;grid-template-columns:84px repeat(12,1fr);gap:3px;font-size:12px;align-items:center}
.sn-cal .h{text-align:center;color:var(--sub)}.sn-cal .h.now{color:var(--acc);font-weight:700}
.sn-cal .nm{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sn-cal i{height:18px;border-radius:3px;background:var(--line);opacity:.4}.sn-cal i.on{opacity:1}
.sn-note{font-size:13px;color:var(--sub);line-height:1.7}
.sn-in{width:100%;box-sizing:border-box;padding:10px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-bottom:8px;font-family:inherit}
.sn-g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sn-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.sn-chip{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 10px;font-size:13px}.sn-chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.sn-btn{border:0;background:var(--acc);color:#fff;border-radius:10px;padding:11px;font-size:15px;width:100%}
.sn-ghost{background:none;border:1px solid var(--line);color:var(--ink)}.sn-red{background:#a8392b;margin-top:14px}
.sn-row{padding:10px 4px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.7}
.sn-tag{display:inline-block;background:var(--bg);border-radius:999px;padding:1px 9px;font-size:12px;margin:0 4px 2px 0}
.sn-del{border:1px solid var(--line);background:none;border-radius:8px;padding:3px 10px;font-size:12px;color:var(--sub);margin-top:4px}.sn-del.ask{background:#b3412f;color:#fff;border-color:#b3412f}
/* toc */
.toc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 4px}
.ico{flex:0 0 auto;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;color:#fff}
.toc .nm{flex:1;font-size:18px}
.toc .no{font-size:13px;color:var(--sub)}
.del{border:1px solid var(--line);background:none;border-radius:8px;padding:6px 9px;font-size:12px;color:var(--sub)}
.del.ask{background:#b3412f;color:#fff;border-color:#b3412f}
.addb{margin-top:18px;width:100%;border:1.5px dashed var(--acc);background:none;color:var(--acc);border-radius:12px;padding:13px;font-size:16px}
#addp{display:none;margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:12px}
#addp.show{display:block}
#addp label{display:block;font-size:13px;color:var(--sub);margin:10px 0 6px}
#addp input[type=text]{width:100%;box-sizing:border-box;padding:11px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{width:40px;height:40px;border-radius:10px;border:2px solid transparent;background:var(--bg);font-size:20px;display:grid;place-items:center;padding:0}
.opt.on{border-color:var(--acc)}
.save{margin-top:14px;width:100%;border:0;border-radius:10px;padding:12px;background:var(--acc);color:#fff;font-size:16px}
/* content pages */
.hd{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.back{border:0;background:none;color:var(--sub);font-size:14px;padding:0 0 10px}
.ph{border:1.5px dashed var(--line);border-radius:12px;padding:16px;margin-bottom:12px;color:var(--sub);font-size:15px}
.ph b{display:block;color:var(--ink);font-size:16px;margin-bottom:2px}
/* dots */
#dots{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;padding:7px 12px;border-radius:999px;background:rgba(30,40,28,.45);backdrop-filter:blur(6px);z-index:5}
#dots button{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.5)}
#dots button.on{background:#fff;width:22px;border-radius:5px}
@media (prefers-reduced-motion:reduce){.book{scroll-behavior:auto}}
:root{--foil:linear-gradient(135deg,#7a5a14 0%,#e9cf7a 22%,#fff3b8 38%,#b8902f 55%,#f1d97e 72%,#8a6a1f 100%)}
.gf{background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.55)) drop-shadow(0 -1px 0 rgba(255,240,170,.3))}
.cover,.pg.bk{background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 30% 18%,rgba(255,255,255,.12),transparent 62%),var(--cov);box-shadow:inset 0 0 60px rgba(0,0,0,.42)}
.cover::before,.pg.bk::before{content:"";position:absolute;top:8px;bottom:8px;width:5px;background:repeating-linear-gradient(to bottom,#efe3c4 0 1px,#cdbb8c 1px 2px);z-index:2;opacity:.9}
.cover::before{right:0}.pg.bk::before{left:0}
.cover h1{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-size:52px;line-height:1.02;letter-spacing:.05em;text-shadow:none;color:transparent}
.frame{border:3px solid transparent;border-image:var(--foil) 1;box-shadow:0 1px 3px rgba(0,0,0,.55)}
.frame2{border:1px solid transparent;border-image:var(--foil) 1}
.orn{border-style:solid;border-width:1px 0;border-color:transparent;border-image:var(--foil) 1}.orn::after{color:#e9cf7a}
.y-em{border:2px solid transparent;border-image:var(--foil) 1;box-shadow:0 1px 2px rgba(0,0,0,.5)}
.h-fr{border:3px solid transparent;border-image:var(--foil) 1}.h-pl{border:1px solid transparent;border-image:var(--foil) 1}.h-c{background:var(--foil);opacity:1}
.spine,.y-sp{background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(255,255,255,.2) 38%,rgba(0,0,0,.5)),var(--covd);box-shadow:inset -4px 0 6px rgba(0,0,0,.4),3px 0 8px rgba(0,0,0,.45)}
.spine::after,.y-sp::after{content:"";position:absolute;inset:0;background:var(--foil) 0 12%/100% 3px no-repeat,var(--foil) 0 15%/100% 2px no-repeat,var(--foil) 0 85%/100% 3px no-repeat,var(--foil) 0 88%/100% 2px no-repeat}
.bsp{left:auto;right:0;border-right:0;border-left:2px solid var(--covd);box-shadow:inset 4px 0 6px rgba(0,0,0,.4),-3px 0 8px rgba(0,0,0,.45)}
.stamp{position:relative;width:76px;height:76px;border-radius:50%;border:2.5px solid #f4e9cc;color:#f4e9cc;display:grid;place-items:center;text-align:center;font-size:15px;line-height:1.25;letter-spacing:.12em;transform:rotate(-9deg);opacity:.88;filter:url(#rough)}
.stamp::before{content:"";position:absolute;inset:4px;border:1px solid #f4e9cc;border-radius:50%}
.stamp.pos{position:absolute;left:16px;bottom:16px;z-index:3}
.h-pl .stamp{color:#8a2a22;border-color:#8a2a22;mix-blend-mode:multiply}.h-pl .stamp::before{border-color:#8a2a22}
.pg.bk{padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#f1e6c8}
.bk-card{position:relative;z-index:1;width:72%;margin-right:26px;box-sizing:border-box;padding:22px 16px 10px;border:3px solid transparent;border-image:var(--foil) 1;background:rgba(0,0,0,.14)}
.bk-t{font:700 32px "Cormorant Garamond",Georgia,serif;letter-spacing:.1em;text-align:center;margin-bottom:16px}
.bk-card label{display:block;margin-bottom:14px;font-size:12px;letter-spacing:.15em}
.bk-card input{display:block;width:100%;box-sizing:border-box;background:transparent;border:0;border-bottom:1px solid currentColor;color:inherit;font-size:16px;padding:5px 0;font-family:inherit;outline:0}
.bk-card input::placeholder{color:inherit;opacity:.4}
.pg.bk[data-d="1"] .bk-card{background:#f6f1e0;color:#2b2418;border:1.5px solid var(--covd);border-image:none}
.pg.bk[data-d="2"] .bk-card{background:#efe3c4;color:#2b2418}
.pg.bk[data-d="1"] .gf,.pg.bk[data-d="2"] .gf{background:none;-webkit-text-fill-color:#6a5a2a;filter:none}
.y-ttl{position:absolute;left:34px;right:62px;top:42%;transform:translateY(-50%);display:flex;align-items:center;gap:8px;z-index:2}
.y-ttl svg{display:block;flex:0 0 auto;width:38px;height:38px;margin:0;filter:drop-shadow(0 1px 0 rgba(0,0,0,.55))}
.y-ttl b{display:block;font-size:clamp(14px,4.8vw,20px);letter-spacing:.06em;font-weight:700;white-space:nowrap}
.y-ttl .stamp{position:absolute;right:-6px;bottom:-56px;width:70px;height:70px;font-size:14px;background:rgba(244,233,204,.92);color:#b3302a;border-color:#b3302a;opacity:.95}
.y-ttl .stamp::before{border-color:#b3302a}
.h-title{position:absolute;left:0;right:0;bottom:0;height:30%;min-height:92px;background:radial-gradient(ellipse at 20% 30%,rgba(255,235,190,.12),transparent 50%),linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.05)),var(--covd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 14px;border-top:2px solid transparent;border-image:var(--foil) 1;box-shadow:inset 0 8px 12px rgba(0,0,0,.4)}
.h-title svg{flex:0 0 auto;width:30px;height:30px;filter:url(#worn) drop-shadow(0 1px 0 rgba(0,0,0,.6)) drop-shadow(0 -1px 0 rgba(255,245,190,.4))}
.h-title span{flex:0 0 auto;text-align:center;font:900 clamp(17px,5.6vw,24px)/1 "Noto Sans JP","Hiragino Kaku Gothic StdN","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;letter-spacing:.12em;white-space:nowrap;filter:url(#worn) drop-shadow(0 1px 0 rgba(0,0,0,.75)) drop-shadow(0 -1px 0 rgba(255,245,190,.5)) drop-shadow(0 2px 3px rgba(0,0,0,.55))}
.h-pl .stamp.pos{bottom:34%}
.cover>.y-sp{left:0;top:0;bottom:0;z-index:2}

  const K=["予定","記録","スポット","メモ","リンク"],KEY=["ev","lg","sp","mm","lk"];
  const D={};KEY.forEach(k=>D[k]=ld(pre+k,[]));
  let tab=0,ask=null,sel=td(),ym=td().slice(0,7),msg="";
  const save=k=>sv(pre+k,D[k]),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const dl=(k,i)=>`<button class="sn-del${ask===k+i?" ask":""}" data-dl="${k}:${i}">${ask===k+i?"本当に削除":"削除"}</button>`;
  const nb=t=>E(t).replace(/\n/g,"<br>");
  const f2=n=>String(n).padStart(2,"0");
  const gc=x=>{const n=new Date(x.d+"T00:00:00");n.setDate(n.getDate()+1);return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(x.t)+"&dates="+x.d.replace(/-/g,"")+"/"+n.getFullYear()+f2(n.getMonth()+1)+f2(n.getDate())+"&location="+encodeURIComponent(x.pl||"")+"&details="+encodeURIComponent(x.m||"")};
  const evV=()=>{
    const [y,m]=ym.split("-").map(Number),first=new Date(y,m-1,1).getDay(),n=new Date(y,m,0).getDate(),has=new Set(D.ev.map(x=>x.d));
    let g=["日","月","火","水","木","金","土"].map(w=>`<b>${w}</b>`).join("")+"<span></span>".repeat(first);
    for(let i=1;i<=n;i++){const ds=ym+"-"+f2(i);g+=`<button data-sd="${ds}" class="${has.has(ds)?"ev ":""}${ds===sel?"on ":""}${ds===td()?"tdy":""}">${i}</button>`}
    const day=D.ev.map((x,i)=>({x,i})).filter(a=>a.x.d===sel);
    const up=D.ev.map((x,i)=>({x,i})).filter(a=>a.x.d>=td()&&!a.x.done).sort((a,b)=>a.x.d.localeCompare(b.x.d)).slice(0,8);
    const line=a=>`<div class="sn-row"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-dn="${a.i}" ${a.x.done?"checked":""} style="width:20px;height:20px"><b${a.x.done?' style="text-decoration:line-through;opacity:.6"':""}>${E(a.x.t)}</b></label><small>${E(a.x.d)}${a.x.pl?"　"+E(a.x.pl):""}</small>${a.x.m?"<br>"+nb(a.x.m):""}<br><a class="sn-note" href="${E(gc(a.x))}" target="_blank" rel="noopener noreferrer">📅 Googleカレンダーに追加</a>　${dl("ev",a.i)}</div>`;
    return `<div class="cmv"><button data-mv="-1" aria-label="前の月">‹</button><b>${y}年${m}月</b><button data-mv="1" aria-label="次の月">›</button></div><div class="cg">${g}</div><div class="nl">${E(sel)} の予定</div>${day.map(line).join("")||'<p class="sn-note">この日の予定はありません。</p>'}<div class="nl">これからの予定</div>${up.map(line).join("")||'<p class="sn-note">ありません。</p>'}<div class="ic"><h4>予定を追加</h4><input class="sn-in" type="date" id="e-d" value="${E(sel)}"><input class="sn-in" id="e-t" placeholder="予定の名前" maxlength="40"><input class="sn-in" id="e-p" placeholder="場所（任意）" maxlength="40"><input class="sn-in" id="e-m" placeholder="メモ（任意）" maxlength="100"><button class="sn-btn" id="ad-ev">予定を追加</button></div>`};
  const lgV=()=>`<div class="ic"><h4>記録を書く</h4><input class="sn-in" type="date" id="l-d" value="${td()}"><input class="sn-in" id="l-t" placeholder="タイトル" maxlength="40"><textarea class="sn-in" id="l-x" rows="4" maxlength="800" placeholder="できごと・感想など"></textarea><button class="sn-btn" id="ad-lg">記録を追加</button></div>`+(D.lg.map((x,i)=>({x,i})).sort((a,b)=>b.x.d.localeCompare(a.x.d)).map(a=>`<div class="sn-row"><b>${E(a.x.t)}</b>　<small>${E(a.x.d)}</small><br>${nb(a.x.x)}<br>${dl("lg",a.i)}</div>`).join("")||'<p class="sn-note">まだ記録はありません。</p>');
  const spV=()=>`<div class="ic"><h4>スポットを追加</h4><input class="sn-in" id="s-n" placeholder="場所の名前" maxlength="40"><input class="sn-in" id="s-m" placeholder="メモ（駐車場・見どころなど）" maxlength="120"><label class="sn-row" style="display:flex;gap:8px;align-items:center;border:0"><input type="checkbox" id="s-g" style="width:20px;height:20px">現在地も記録する</label><button class="sn-btn" id="ad-sp">スポットを追加</button><p class="sn-note">${E(msg)}</p></div>`+(D.sp.map((x,i)=>`<div class="sn-row"><b>📍 ${E(x.n)}</b>${x.m?"<br>"+nb(x.m):""}${x.la?`<br><a href="https://www.google.com/maps?q=${x.la},${x.lo}" target="_blank" rel="noopener noreferrer">地図で開く</a>`:""}<br>${dl("sp",i)}</div>`).join("")||'<p class="sn-note">まだありません。</p>');
  const mmV=()=>`<div class="ic"><h4>メモを書く</h4><textarea class="sn-in" id="m-x" rows="4" maxlength="800" placeholder="自由にメモ"></textarea><button class="sn-btn" id="ad-mm">メモを追加</button></div>`+(D.mm.map((x,i)=>`<div class="sn-row"><small>${E(x.d)}</small><br>${nb(x.x)}<br>${dl("mm",i)}</div>`).join("")||'<p class="sn-note">まだありません。</p>');
  const lkV=()=>`<div class="ic"><h4>リンクを追加</h4><input class="sn-in" id="k-t" placeholder="名前" maxlength="30"><input class="sn-in" id="k-u" placeholder="https://..." maxlength="200"><button class="sn-btn" id="ad-lk">リンクを追加</button><p class="sn-note">${E(msg)}</p></div>`+(D.lk.map((x,i)=>`<div class="sn-row"><a href="${E(x.u)}" target="_blank" rel="noopener noreferrer"><b>🔗 ${E(x.t)}</b></a><br><small class="sn-note">${E(x.u)}</small><br>${dl("lk",i)}</div>`).join("")||'<p class="sn-note">まだありません。</p>');
  const render=()=>{root.innerHTML=`<div class="sn-tabs">${K.map((t,i)=>`<button class="${tab===i?"on":""}" data-t="${i}">${t}</button>`).join("")}</div>`+[evV,lgV,spV,mmV,lkV][tab]()};
  const add=(k,o)=>{D[k].unshift(Object.assign({id:id()},o));save(k);ask=null;msg="";render()};
  root.addEventListener("click",e=>{const b=e.target.closest("button,input[data-dn]");if(!b)return;const d=b.dataset;
    if(d.dn!==undefined){const x=D.ev[+d.dn];x.done=!x.done;save("ev");render();return}
    if(d.t!==undefined){tab=+d.t;ask=null;msg="";render()}
    else if(d.mv){const [y,m]=ym.split("-").map(Number),dt=new Date(y,m-1+ +d.mv,1);ym=dt.getFullYear()+"-"+f2(dt.getMonth()+1);render()}
    else if(d.sd){sel=d.sd;render()}
    else if(d.dl){const [k,i]=d.dl.split(":");if(ask===k+i){D[k].splice(+i,1);save(k);ask=null}else ask=k+i;render()}
    else if(b.id==="ad-ev"){const t=$("e-t").value.trim(),dd=$("e-d").value;if(!t||!dd)return;sel=dd;ym=dd.slice(0,7);add("ev",{d:dd,t,pl:$("e-p").value.trim(),m:$("e-m").value.trim(),done:false})}
    else if(b.id==="ad-lg"){const t=$("l-t").value.trim(),x=$("l-x").value.trim();if(!t&&!x)return;add("lg",{d:$("l-d").value||td(),t:t||"（無題）",x})}
    else if(b.id==="ad-sp"){const n=$("s-n").value.trim(),m=$("s-m").value.trim();if(!n)return;
      if($("s-g").checked&&navigator.geolocation){msg="現在地を取得しています…";render();navigator.geolocation.getCurrentPosition(p=>add("sp",{n,m,la:+p.coords.latitude.toFixed(4),lo:+p.coords.longitude.toFixed(4)}),()=>{add("sp",{n,m});msg="現在地は取れませんでした。名前とメモだけ保存しました。";render()},{enableHighAccuracy:true,timeout:15000})}
      else add("sp",{n,m})}
    else if(b.id==="ad-mm"){const x=$("m-x").value.trim();if(!x)return;add("mm",{d:td(),x})}
    else if(b.id==="ad-lk"){const t=$("k-t").value.trim(),u=$("k-u").value.trim();if(!t||!okUrl(u)){msg="名前と、https:// から始まるURLを入れてください。";render();return}add("lk",{t,u})}
  });
  render();
}

(function(){
